<header class="phead wrap pl-head">
  <h1>log in on your phone</h1>
  <p class="lede">get dusk bot from the app store, open it and choose log in to dusk cloud. your cloud opens on its own, no code needed.</p>
</header>

<section class="wrap pl" data-pl="signin">
  <div class="pl-card" data-pl-has hidden>
    <p class="pl-label" id="pl-email-label">log in with</p>
    <p class="pl-value pl-email" data-pl-value aria-labelledby="pl-email-label"></p>
  </div>
  <div class="pl-actions">
    <a class="btn dark pl-store" href="{{ios-link}}"><img src="/art/store-apple.png" alt="" width="18" height="22">get it on the app store</a>
    <a class="btn light" href="duskbot://signin" data-pl-open>already have it? open dusk bot</a>
  </div>
  <p class="pl-android"><img src="/art/store-android.png" alt="" width="22" height="25"><span>on android? <a href="{{dl android}}" download>download the android app</a> (.apk), then open this link again.</span></p>
</section>
