rotected\":false},\"profile_bio\":{\"description\":\"Occasionally here. Currently research @OpenAI.\"},\"profile_image_shape\":\"Circle\",\"relationship_counts\":{\"followers\":24692,\"following\":115},\"rest_id\":\"1181779988\",\"super_follow_eligible\":false,\"tweet_counts\":{\"tweets\":207},\"verification\":{\"is_blue_verified\":true}}}},\"counts\":{\"favorite_count\":749,\"quote_count\":9,\"reply_count\":57,\"retweet_count\":82},\"details\":{\"cashtag_entities\":[],\"created_at_ms\":1795032449000,\"display_text_range\":[0,278],\"full_text\":\"A lot has happened in the past couple months, to say the least.\\n\\nToday we are sharing a recap of what it takes to move a frontier model from training to internal use to public release. As model capabilities rise, so do the safety and alignment standards required to move forward\",\"hashtag_entities\":[],\"smarttags\":[]},\"edit_control\":{\"__typename\":\"EditControlInitial\",\"edit_tweet_ids\":[\"2123146093366333850\"]},\"grok_translated_post_with_availability\":{\"__typename\":\"ApiGrokTranslateResponse\",\"is_available\":false},\"id\":\"VHdlZXQ6MjEyMzE0NjA5MzM2NjMzMzg1MA==\",\"legacy\":{\"entities\":{},\"lang\":\"en\"},\"media_entities2\":[],\"mention_entities\":[],\"note_tweet\":{\"is_expandable\":true,\"note_tweet_results\":{\"id\":\"Tm90ZVR3ZWV0UmVzdWx0czoyMTIzMTQ2MDkzMjE1MjkzNDQw\",\"result\":{\"__typename\":\"NoteTweet\",\"entity_set\":{\"hashtags\":[],\"smarttags\":[],\"symbols\":[],\"urls\":[{\"display_url\":\"openai.com/index/managing…\",\"expanded_url\":\"https://openai.com/index/managing-frontier-ai-risk/\",\"indices\":[1089,1112],\"url\":\"https://t.co/87zeS2zI8L\"}],\"user_mentions\":[]},\"id\":\"Tm90ZVR3ZWV0OjIxMjMxNDYwOTMyMTUyOTM0NDA=\",\"text\":\"A lot has happened in the past couple months, to say the least.\\n\\nToday we are sharing a recap of what it takes to move a frontier model from training to internal use to public release. As model capabilities rise, so do the safety and alignment standards required to move forward to the next stage.\\n\\nTo meet these standards, we rely on four layers of protection:\\n1. Model alignment: train models to reliably act as intended and respect human oversight.\\n2. Security and sandboxing: restrict what models can access and affect.\\n3. Blocking safeguards: stop harmful or unauthorized actions before they happen.\\n4. Monitoring and response: detect concerning behavior and intervene.\\n\\nThe post brings together efforts from across the company, with links to recent research, technical work, and incident reports we’ve published. This is the baseline operational discipline we owe people as we continue training and deploying models - necessary work, but not a solution to alignment in the limit. There’s a lot more to do, and will continue keeping you informed as the thinking and work evolves. 🏗️\\n\\nhttps://t.co/87zeS2zI8L\"}}},\"rest_id\":\"2123146093366333850\",\"url_entities\":[],\"views\":{\"count\":\"370257\"}}},\"rest_id\":\"2123165872261075233\",\"url_entities\":[],\"views\":{\"count\":\"307852\"}}}}},\"entry_id\":\"tweet-2123165872261075233\",\"sort_index\":\"2123958275006267388\"}]},{\"__typename\":\"TimelineTerminateTimeline\",\"direction\":\"TopAndBottom\"}]}}}}}}"}]</script></body></html>
